  <script src="cloud.js">
    // عداد زيارات الموقع
async function countVisit() {
  try {
    const response = await fetch(
      "https://api.counterapi.dev/v1/kashafa-tunis/visits/up"
    );

    const data = await response.json();

    console.log("عدد الزيارات:", data.count);

    // إذا عندك عنصر في HTML لعرض العدد
    const counter = document.getElementById("visit-count");

    if (counter) {
      counter.textContent = data.count.toLocaleString("en-US");
    }

  } catch (error) {
    console.error("خطأ في عداد الزيارات:", error);
  }
}

// تسجيل زيارة عند دخول الموقع
countVisit();
  </script>
